[package]
name = "cockpit-core"
description = "What the Rust space apps share: theme, terminal, file watching, the bridge that runs actions through the hub, routines, palette, dialogs and toasts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
crossterm.workspace = true
notify.workspace = true
nucleo-matcher.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
tachyonfx.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Wdk_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }
